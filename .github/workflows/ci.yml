name: CI

on:
  push:
    branches: [main]
    # Docs-only pushes don't need a build. PRs always run (merge gate).
    paths-ignore: ['**/*.md']
  pull_request:

# A newer push to the same branch/PR supersedes an in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # version:check counts every commit
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run version:check
      - run: npm test
      # `build` is `tsc --noEmit && vite build` — this is also the typecheck.
      - run: npm run build
