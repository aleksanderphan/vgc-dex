name: CI

# PRs are the only merge gate; a push to `main` just deploys (Vercel), so there's
# no second CI run on the commit that already went green on its PR.
on:
  pull_request:
  workflow_dispatch:

# A newer push to the same PR supersedes an in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # version:check counts every commit
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run version:check
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      # `build` is `tsc --noEmit && vite build` — this is also the typecheck.
      - run: npm run build
